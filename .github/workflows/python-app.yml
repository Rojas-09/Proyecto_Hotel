name: HotelBook Pro — CI

on:
  push:
    branches: [main, Development, Testing]
  pull_request:
    branches: [main, Development, Testing]

jobs:
  test:
    name: Lint + Tests + Coverage
    runs-on: ubuntu-latest

    env:
      FLASK_ENV: testing
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      STRIPE_MOCK: "true"
      STRIPE_SECRET_KEY: ${{ secrets.CI_STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint con flake8
        run: flake8 app/ --max-line-length=100 --select=E,F

      - name: Tests con cobertura
        run: pytest tests/ --cov=app --cov-config=.coveragerc --cov-fail-under=90 -q --no-cov-on-fail
        timeout-minutes: 5