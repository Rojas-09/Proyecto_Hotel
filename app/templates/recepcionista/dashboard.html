{% extends "layouts/base_public.html" %}

{% block title %}Panel Recepcionista — HotelBook Pro{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recepcionista/dashboard.css') }}">
{% endblock %}

{% block content %}
<div class="dashboard-page container" data-reveal>
    <div class="dashboard-header">
        <span class="section-label">Panel Operativo</span>
        <h1>Recepción<span class="gold">.</span></h1>
    </div>

    <div class="placeholder-note" data-reveal>
        <i class="ti ti-user-check" style="font-size: 4rem; margin-bottom: 1rem;"></i>
        <h2>Panel de recepcionista en desarrollo</h2>
        <p>Gestión de check-in, check-out y reservas activas.</p>
    </div>
</div>
{% endblock %}
