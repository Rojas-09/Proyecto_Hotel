{% extends "layouts/base_recepcionista.html" %}

{% block title %}Reservas — HotelBook Pro{% endblock %}

{% block content %}
<div style="padding-top: 2rem;">
    <div class="container">
        <div class="page-header d-flex-between">
            <div>
                <h1>Gestión de Reservas</h1>
                <p class="text-muted mb-0">Todas las reservas del sistema</p>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                <form method="GET" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Estado</label>
                        <select name="estado" class="form-control" onchange="this.form.submit()">
                            <option value="">Todos</option>
                            <option value="pendiente" {% if request.args.get('estado') == 'pendiente' %}selected{% endif %}>Pendiente</option>
                            <option value="confirmada" {% if request.args.get('estado') == 'confirmada' %}selected{% endif %}>Confirmada</option>
                            <option value="ocupada" {% if request.args.get('estado') == 'ocupada' %}selected{% endif %}>Ocupada</option>
                            <option value="completada" {% if request.args.get('estado') == 'completada' %}selected{% endif %}>Completada</option>
                            <option value="cancelada" {% if request.args.get('estado') == 'cancelada' %}selected{% endif %}>Cancelada</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Fecha Entrada</label>
                        <input type="date" name="fecha_entrada" class="form-control" value="{{ request.args.get('fecha_entrada', '') }}">
                    </div>
                    <button type="submit" class="btn btn-secondary btn-sm">Filtrar</button>
                </form>
            </div>
        </div>

        <div id="reservas-table">
            <div class="text-center text-muted" style="padding:2rem;">
                <span class="spinner spinner-lg"></span>
                <p class="mt-2">Cargando reservas...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
(function() {
    var estado = '{{ request.args.get("estado", "") }}';
    var fechaEntrada = '{{ request.args.get("fecha_entrada", "") }}';
    var params = {};
    if (estado) params.estado = estado;
    if (fechaEntrada) params.fecha_entrada = fechaEntrada;

    function fmtDate(d) {
        return new Date(d).toLocaleDateString('es-CO', {year:'numeric', month:'short', day:'numeric'});
    }

    function estadoBadge(e) {
        var m = {
            'pendiente': ['badge-warning', 'Pendiente'],
            'confirmada': ['badge-info', 'Confirmada'],
            'ocupada': ['badge-success', 'Ocupada'],
            'completada': ['badge-secondary', 'Completada'],
            'cancelada': ['badge-danger', 'Cancelada'],
        };
        var b = m[e] || ['badge-secondary', e];
        return '<span class="badge ' + b[0] + '">' + b[1] + '</span>';
    }

    function accionBadge(r) {
        if (r.estado === 'confirmada' || r.estado === 'pendiente') {
            return '<button onclick="doCheckin(' + r.id + ')" class="btn btn-success btn-sm">Check-in</button>';
        }
        if (r.estado === 'ocupada') {
            return '<button onclick="doCheckout(' + r.id + ')" class="btn btn-primary btn-sm">Check-out</button>';
        }
        return '<span class="text-muted text-sm">—</span>';
    }

    window.doCheckin = async function(id) {
        if (!confirm('¿Realizar check-in de la reserva #' + id + '?')) return;
        try {
            var res = await HotelBookAPI.put('/api/v1/reservas/' + id + '/checkin', {});
            if (res.success) {
                window.showToast('Check-in realizado.', 'success');
                cargar();
            } else {
                window.showToast(res.error?.message || 'Error.', 'error');
            }
        } catch(e) { window.showToast(e.message, 'error'); }
    };

    window.doCheckout = async function(id) {
        if (!confirm('¿Realizar check-out de la reserva #' + id + '?')) return;
        try {
            var res = await HotelBookAPI.put('/api/v1/reservas/' + id + '/checkout', {});
            if (res.success) {
                window.showToast('Check-out realizado.', 'success');
                cargar();
            } else {
                window.showToast(res.error?.message || 'Error.', 'error');
            }
        } catch(e) { window.showToast(e.message, 'error'); }
    };

    function render(reservas) {
        var el = document.getElementById('reservas-table');
        if (!reservas || reservas.length === 0) {
            el.innerHTML = '<div class="empty-state"><p>No se encontraron reservas.</p></div>';
            return;
        }
        var html = '<div class="table-wrapper"><table><thead><tr>' +
            '<th>#</th><th>Huésped</th><th>Habitación</th><th>Entrada</th><th>Salida</th>' +
            '<th>Total</th><th>Estado</th><th>Acciones</th>' +
            '</tr></thead><tbody>';
        reservas.forEach(function(r) {
            html += '<tr>' +
                '<td><strong>#' + r.id + '</strong></td>' +
                '<td>' + (r.huesped?.usuario?.nombre || '—') + ' ' + (r.huesped?.usuario?.apellido || '') + '</td>' +
                '<td>' + (r.habitacion_numero || '—') + '</td>' +
                '<td>' + fmtDate(r.fecha_entrada) + '</td>' +
                '<td>' + fmtDate(r.fecha_salida) + '</td>' +
                '<td>$' + Number(r.total || 0).toLocaleString('es-CO') + '</td>' +
                '<td>' + estadoBadge(r.estado) + '</td>' +
                '<td class="actions">' + accionBadge(r) + '</td>' +
                '</tr>';
        });
        el.innerHTML = html + '</tbody></table></div>';
    }

    function cargar() {
        HotelBookAPI.get('/api/v1/reservas/').then(function(res) {
            if (res.success) {
                var data = res.data || [];
                if (estado) data = data.filter(function(r) { return r.estado === estado; });
                render(data);
            } else {
                document.getElementById('reservas-table').innerHTML =
                    '<div class="alert alert-danger">Error: ' + (res.error?.message || 'desconocido') + '</div>';
            }
        }).catch(function(e) {
            document.getElementById('reservas-table').innerHTML =
                '<div class="alert alert-danger">Error de conexión: ' + e.message + '</div>';
        });
    }

    cargar();
})();
</script>
{% endblock %}
