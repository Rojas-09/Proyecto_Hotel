{% extends "layouts/base_admin.html" %}

{% block title %}Gestión de Habitaciones — HotelBook Pro{% endblock %}

{% block content %}
<div style="padding-top: 2rem;">
    <div class="container">
        <div class="page-header d-flex-between">
            <div>
                <h1>Gestión de Habitaciones</h1>
                <p class="text-muted mb-0">Crear, editar y desactivar habitaciones</p>
            </div>
            <button class="btn btn-primary" onclick="mostrarCrear()">+ Nueva Habitación</button>
        </div>

        <div class="card mb-3">
            <div class="card-body" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                <form method="GET" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Estado</label>
                        <select name="estado" class="form-control" onchange="this.form.submit()">
                            <option value="">Todos</option>
                            <option value="disponible" {% if request.args.get('estado')=='disponible' %}selected{% endif %}>Disponible</option>
                            <option value="ocupada" {% if request.args.get('estado')=='ocupada' %}selected{% endif %}>Ocupada</option>
                            <option value="mantenimiento" {% if request.args.get('estado')=='mantenimiento' %}selected{% endif %}>Mantenimiento</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Tipo</label>
                        <select name="tipo" class="form-control" onchange="this.form.submit()">
                            <option value="">Todos</option>
                            <option value="simple" {% if request.args.get('tipo')=='simple' %}selected{% endif %}>Simple</option>
                            <option value="doble" {% if request.args.get('tipo')=='doble' %}selected{% endif %}>Doble</option>
                            <option value="suite" {% if request.args.get('tipo')=='suite' %}selected{% endif %}>Suite</option>
                            <option value="deluxe" {% if request.args.get('tipo')=='deluxe' %}selected{% endif %}>Deluxe</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <div id="habitaciones-container">
            <div class="text-center text-muted" style="padding:2rem;">
                <span class="spinner spinner-lg"></span>
                <p class="mt-2">Cargando...</p>
            </div>
        </div>
    </div>
</div>

<div id="modal-crear" class="modal-backdrop" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Nueva Habitación</h3>
            <button class="modal-close" onclick="cerrarCrear()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="crear-hab-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Número *</label>
                        <input type="text" id="hab-numero" class="form-control" maxlength="10" required placeholder="101">
                    </div>
                    <div class="form-group">
                        <label>Tipo *</label>
                        <select id="hab-tipo" class="form-control" required>
                            <option value="">Seleccionar...</option>
                            <option value="simple">Simple</option>
                            <option value="doble">Doble</option>
                            <option value="suite">Suite</option>
                            <option value="deluxe">Deluxe</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio/Noche ($) *</label>
                        <input type="number" id="hab-precio" class="form-control" min="10000" step="1000" required placeholder="150000">
                    </div>
                    <div class="form-group">
                        <label>Capacidad *</label>
                        <input type="number" id="hab-capacidad" class="form-control" min="1" max="10" required placeholder="2">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Piso *</label>
                        <input type="number" id="hab-piso" class="form-control" min="1" max="50" required placeholder="1">
                    </div>
                    <div class="form-group">
                        <label>Estado *</label>
                        <select id="hab-estado" class="form-control" required>
                            <option value="disponible">Disponible</option>
                            <option value="mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="hab-descripcion" class="form-control" rows="3" maxlength="500" placeholder="Habitación con vista al jardín..."></textarea>
                </div>
                <div id="crear-error" class="alert alert-danger" style="display:none;"></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarCrear()">Cancelar</button>
            <button class="btn btn-primary" onclick="crearHabitacion()">Crear</button>
        </div>
    </div>
</div>

<div id="modal-editar" class="modal-backdrop" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Editar Habitación</h3>
            <button class="modal-close" onclick="cerrarEditar()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="editar-hab-form">
                <input type="hidden" id="hab-e-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Número *</label>
                        <input type="text" id="hab-e-numero" class="form-control" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo *</label>
                        <select id="hab-e-tipo" class="form-control" required>
                            <option value="simple">Simple</option>
                            <option value="doble">Doble</option>
                            <option value="suite">Suite</option>
                            <option value="deluxe">Deluxe</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio/Noche ($) *</label>
                        <input type="number" id="hab-e-precio" class="form-control" min="10000" step="1000" required>
                    </div>
                    <div class="form-group">
                        <label>Capacidad *</label>
                        <input type="number" id="hab-e-capacidad" class="form-control" min="1" max="10" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Piso *</label>
                        <input type="number" id="hab-e-piso" class="form-control" min="1" max="50" required>
                    </div>
                    <div class="form-group">
                        <label>Estado *</label>
                        <select id="hab-e-estado" class="form-control" required>
                            <option value="disponible">Disponible</option>
                            <option value="ocupada">Ocupada</option>
                            <option value="mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="hab-e-descripcion" class="form-control" rows="3" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="hab-e-activo"> Activa
                    </label>
                </div>
                <div id="editar-error" class="alert alert-danger" style="display:none;"></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarEditar()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarEditar()">Guardar</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
(function() {
    var habitaciones = [];
    var filtroEstado = '{{ request.args.get("estado", "") }}';
    var filtroTipo = '{{ request.args.get("tipo", "") }}';

    function estadoBadge(e) {
        var m = {'disponible': 'badge-success', 'ocupada': 'badge-danger', 'mantenimiento': 'badge-warning'};
        return '<span class="badge ' + (m[e] || 'badge-secondary') + '">' + (e || '—') + '</span>';
    }

    function tipoBadge(t) { return '<span class="badge badge-info">' + (t || '—') + '</span>'; }

    function render(data) {
        habitaciones = data || [];
        var el = document.getElementById('habitaciones-container');
        if (!habitaciones.length) {
            el.innerHTML = '<div class="empty-state"><p>No hay habitaciones.</p></div>';
            return;
        }
        var html = '<div class="table-wrapper"><table><thead><tr>' +
            '<th>Número</th><th>Tipo</th><th>Capacidad</th><th>Piso</th><th>Precio</th><th>Estado</th><th>Acciones</th>' +
            '</tr></thead><tbody>';
        habitaciones.forEach(function(h) {
            html += '<tr>' +
                '<td><strong>' + h.numero + '</strong></td>' +
                '<td>' + tipoBadge(h.tipo) + '</td>' +
                '<td>' + h.capacidad + '</td>' +
                '<td>' + h.piso + '</td>' +
                '<td>$' + Number(h.precio_noche).toLocaleString('es-CO') + '</td>' +
                '<td>' + estadoBadge(h.estado) + '</td>' +
                '<td class="actions">' +
                '<button onclick="mostrarEditar(' + h.id + ')" class="btn btn-secondary btn-sm">Editar</button>' +
                (h.activo ? '<button onclick="eliminarHabitacion(' + h.id + ')" class="btn btn-danger btn-sm">Eliminar</button>' : '') +
                '</td></tr>';
        });
        el.innerHTML = html + '</tbody></table></div>';
    }

    window.mostrarCrear = function() {
        document.getElementById('crear-hab-form').reset();
        document.getElementById('crear-error').style.display = 'none';
        document.getElementById('modal-crear').style.display = 'flex';
    };

    window.mostrarEditar = function(id) {
        var h = habitaciones.find(function(x) { return x.id === id; });
        if (!h) return;
        document.getElementById('hab-e-id').value = h.id;
        document.getElementById('hab-e-numero').value = h.numero;
        document.getElementById('hab-e-tipo').value = h.tipo;
        document.getElementById('hab-e-precio').value = h.precio_noche;
        document.getElementById('hab-e-capacidad').value = h.capacidad;
        document.getElementById('hab-e-piso').value = h.piso;
        document.getElementById('hab-e-estado').value = h.estado;
        document.getElementById('hab-e-descripcion').value = h.descripcion || '';
        document.getElementById('hab-e-activo').checked = h.activo !== false;
        document.getElementById('editar-error').style.display = 'none';
        document.getElementById('modal-editar').style.display = 'flex';
    };

    window.cerrarCrear = function() { document.getElementById('modal-crear').style.display = 'none'; };
    window.cerrarEditar = function() { document.getElementById('modal-editar').style.display = 'none'; };

    window.crearHabitacion = async function() {
        var errEl = document.getElementById('crear-error');
        errEl.style.display = 'none';
        var payload = {
            numero: document.getElementById('hab-numero').value.trim(),
            tipo: document.getElementById('hab-tipo').value,
            precio_noche: parseFloat(document.getElementById('hab-precio').value),
            capacidad: parseInt(document.getElementById('hab-capacidad').value),
            piso: parseInt(document.getElementById('hab-piso').value),
            estado: document.getElementById('hab-estado').value,
            descripcion: document.getElementById('hab-descripcion').value.trim(),
        };
        if (!payload.numero || !payload.tipo || !payload.precio_noche || !payload.capacidad || !payload.piso) {
            errEl.textContent = 'Completa todos los campos obligatorios.'; errEl.style.display = 'block'; return;
        }
        try {
            var res = await HotelBookAPI.post('/api/v1/habitaciones/', payload);
            if (res.success) { window.showToast('Habitación creada.', 'success'); cerrarCrear(); cargar(); }
            else { errEl.textContent = res.error?.message || 'Error.'; errEl.style.display = 'block'; }
        } catch(e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    };

    window.guardarEditar = async function() {
        var errEl = document.getElementById('editar-error');
        errEl.style.display = 'none';
        var id = parseInt(document.getElementById('hab-e-id').value);
        var payload = {
            numero: document.getElementById('hab-e-numero').value.trim(),
            tipo: document.getElementById('hab-e-tipo').value,
            precio_noche: parseFloat(document.getElementById('hab-e-precio').value),
            capacidad: parseInt(document.getElementById('hab-e-capacidad').value),
            piso: parseInt(document.getElementById('hab-e-piso').value),
            estado: document.getElementById('hab-e-estado').value,
            descripcion: document.getElementById('hab-e-descripcion').value.trim(),
            activo: document.getElementById('hab-e-activo').checked,
        };
        try {
            var res = await HotelBookAPI.put('/api/v1/habitaciones/' + id, payload);
            if (res.success) { window.showToast('Habitación actualizada.', 'success'); cerrarEditar(); cargar(); }
            else { errEl.textContent = res.error?.message || 'Error.'; errEl.style.display = 'block'; }
        } catch(e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    };

    window.eliminarHabitacion = async function(id) {
        if (!confirm('¿Eliminar esta habitación?')) return;
        try {
            var res = await HotelBookAPI.del('/api/v1/habitaciones/' + id);
            if (res.success) { window.showToast('Habitación eliminada.', 'success'); cargar(); }
            else { window.showToast(res.error?.message || 'Error.', 'error'); }
        } catch(e) { window.showToast(e.message, 'error'); }
    };

    function cargar() {
        var params = {};
        if (filtroEstado) params.estado = filtroEstado;
        if (filtroTipo) params.tipo = filtroTipo;
        HotelBookAPI.getHabitaciones(params).then(function(res) {
            if (res.success) render(res.data);
            else document.getElementById('habitaciones-container').innerHTML =
                '<div class="alert alert-danger">Error: ' + (res.error?.message || '') + '</div>';
        }).catch(function(e) {
            document.getElementById('habitaciones-container').innerHTML =
                '<div class="alert alert-danger">Error: ' + e.message + '</div>';
        });
    }

    cargar();
})();
</script>
{% endblock %}
