{% extends "layouts/base_public.html" %}

{% block title %}Iniciar Sesión — HotelBook Pro{% endblock %}

{% block content %}
<div class="container-xs" style="padding-top: 3rem;">
    <div class="card">
        <div class="card-header">Iniciar Sesión</div>
        <div class="card-body">
            <form action="{{ url_for('views.login_submit') }}" method="POST" autocomplete="off">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" maxlength="150" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" maxlength="128" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
            </form>
        </div>
        <div class="card-footer text-center">
            ¿No tienes cuenta?
            <a href="{{ url_for('views.register_page') }}">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
