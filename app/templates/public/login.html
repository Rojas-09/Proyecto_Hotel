{% extends "layouts/base_public.html" %}
{% block title %}Iniciar Sesión — HotelBook Pro{% endblock %}
{% block extra_css %}
<style>
.pwd-wrapper { position: relative; }
.pwd-wrapper input { padding-right: 2.5rem; }
.pwd-toggle {
  position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  font-size: 1.1rem; line-height: 1; padding: 0.25rem;
}
.pwd-toggle:hover { color: var(--text); }
</style>
{% endblock %}
{% block content %}
<div class="container-xs" style="padding-top: 3rem;">
    <div class="card">
        <div class="card-header">Iniciar Sesión</div>
        <div class="card-body">
            <form action="{{ url_for('views.login_submit') }}" method="POST" autocomplete="off">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" maxlength="150" required autofocus value="{{ email if email else '' }}">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="pwd-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" maxlength="128" required>
                        <button type="button" class="pwd-toggle" onclick="togglePwd('password',this)" tabindex="-1" title="Mostrar/ocultar contraseña">👁</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
            </form>
        </div>
        <div class="card-footer text-center">
            ¿No tienes cuenta?
            <a href="{{ url_for('views.register_page') }}">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePwd(inputId, btn) {
  var input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}
</script>
{% endblock %}
