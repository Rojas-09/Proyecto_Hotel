<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}HotelBook Pro{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/functional.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar" id="main-nav">
    <a href="/" class="navbar-brand">HotelBook Pro</a>
    <ul class="navbar-nav" id="nav-links">
        {% block nav_links %}{% endblock %}
    </ul>
    <div class="navbar-right">
        <span id="user-info" class="text-muted text-sm"></span>
        <button id="logout-btn" class="btn btn-secondary btn-sm" style="display:none;">Cerrar Sesión</button>
    </div>
</nav>

<div id="page-alerts"></div>

<main class="container" style="padding-top: 1.5rem; padding-bottom: 3rem;">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
(function () {
    var token = sessionStorage.getItem("hbp_token");
    if (!token) {
        window.location.href = "/login";
        return;
    }

    // Mostrar info del usuario
    var userInfo = document.getElementById("user-info");
    var logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
        logoutBtn.style.display = "inline-block";
        logoutBtn.addEventListener("click", function () {
            HotelBookAPI.logout();
        });
    }

    // Decodificar token para mostrar nombre
    try {
        var payload = JSON.parse(atob(token.split(".")[1]));
        if (userInfo) {
            userInfo.textContent = payload.email + " (" + payload.rol + ")";
        }
    } catch (e) {
        HotelBookAPI.logout();
    }

    // Global 401/403 handler en fetch (interceptado en api.js)
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
