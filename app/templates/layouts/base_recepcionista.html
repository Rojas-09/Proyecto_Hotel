<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}HotelBook Pro — Recepción{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/functional.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">HotelBook Pro — Recepción</a>
    <ul class="navbar-nav">
        <li><a href="{{ url_for('views.recepcionista_dashboard') }}" id="nav-recep-dashboard">Dashboard</a></li>
        <li><a href="{{ url_for('views.recepcionista_reservas') }}" id="nav-recep-reservas">Reservas</a></li>
        <li><a href="{{ url_for('views.recepcionista_checkin') }}" id="nav-recep-checkin">Check-in/out</a></li>
        <li><a href="{{ url_for('views.recepcionista_servicios') }}" id="nav-recep-servicios">Servicios</a></li>
        <li><a href="{{ url_for('views.recepcionista_huespedes') }}" id="nav-recep-huespedes">Huéspedes</a></li>
    </ul>
    <div class="navbar-right">
        <span id="user-info" class="text-muted text-sm"></span>
        <button id="logout-btn" class="btn btn-secondary btn-sm" style="display:none;">Cerrar Sesión</button>
    </div>
</nav>

<div id="page-alerts"></div>

<div class="container" style="padding-top: 1.5rem; padding-bottom: 3rem;">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
(function () {
    var token = sessionStorage.getItem("hbp_token");
    if (!token) { window.location.href = "/login"; return; }

    try {
        var payload = JSON.parse(atob(token.split(".")[1]));
        if (payload.rol !== "recepcionista") {
            window.location.href = "/";
            return;
        }
        var el = document.getElementById("user-info");
        if (el) el.textContent = payload.email;

        var logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
            logoutBtn.style.display = "inline-block";
            logoutBtn.addEventListener("click", function () { HotelBookAPI.logout(); });
        }

        var navMap = {
            "{{ url_for('views.recepcionista_dashboard') }}": "nav-recep-dashboard",
            "{{ url_for('views.recepcionista_reservas') }}": "nav-recep-reservas",
            "{{ url_for('views.recepcionista_checkin') }}": "nav-recep-checkin",
            "{{ url_for('views.recepcionista_servicios') }}": "nav-recep-servicios",
            "{{ url_for('views.recepcionista_huespedes') }}": "nav-recep-huespedes",
        };
        var path = window.location.pathname;
        for (var route in navMap) {
            if (path === route) {
                var activeEl = document.getElementById(navMap[route]);
                if (activeEl) activeEl.classList.add("active");
                break;
            }
        }
    } catch (e) {
        HotelBookAPI.logout();
    }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
