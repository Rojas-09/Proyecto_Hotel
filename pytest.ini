[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Cobertura mínima requerida: 90%
# Omitir vistas HTML (requieren pruebas con navegador)
addopts =
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=90
    -v

filterwarnings =
    ignore::DeprecationWarning:openpyxl.*